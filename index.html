<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tethered</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #140c1c; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; image-rendering: crisp-edges; image-rendering: pixelated; outline: none; }
</style>
</head>
<body>
<canvas id="game" width="480" height="272" aria-label="Tethered: a two-player rope platformer"></canvas>
<noscript>Tethered needs JavaScript turned on.</noscript>
<script>
/* TETHERED - two players, one rope, one keyboard.
   Sections: SIM (physics + rules), LEVELS (ASCII maps), GAME (drawing, input, menus). */

/* ================= SIM: physics + rules (no DOM) ================= */
const TILE = 16, VW = 480, VH = 272, ROWS = 17;

const CFG = {
  gravity: 1000, maxFall: 430,
  runMax: 104, runAccel: 1150, airAccel: 700, friction: 1500, airDrag: 120, brake: 1.8,
  jumpV: -292, jumpCut: -105, coyote: 0.09, buffer: 0.11,
  ropeLen: 44, ropeK: 46, ropeDamp: 3, ropeMaxAcc: 3400,
  dislodgeAcc: 1750, tautFriction: 650, dislodgePop: 150,
  reelRate: 160, reelRelease: 240, reelMin: 14, reelMaxAcc: 1380, reelLift: 70,
  size: 10, hangLimit: 1e9, stackBoost: 0.4, lowTime: 3, killY: VH + 24,
  yankTime: 0.45, spawnInv: 1.2, exitHold: 0.5
};

const T_EMPTY = 0, T_SOLID = 1, T_SPIKE = 2, T_CANNON = 3;

/* ---------- level parsing ---------- */
function parseLevel(def) {
  const rows = def.rows.slice();
  while (rows.length < ROWS) rows.unshift('');
  const w = Math.max.apply(null, rows.map(r => r.length));
  const grid = rows.map(() => new Uint8Array(w));
  const lv = {
    name: def.name, theme: def.theme || 0, hint: def.hint || '',
    w, h: ROWS, pixelW: w * TILE, grid,
    start: null, exit: null, checkpoints: [], stars: [],
    chaser: def.chaser ? Object.assign({ kind: 'left', speed: 40, delay: 3, lead: 460, startY: 272 }, def.chaser) : null,
    cannons: [], cannonCfg: Object.assign({ period: 3.0, speed: 75 }, def.cannon || {})
  };
  rows.forEach((r, ty) => {
    for (let tx = 0; tx < w; tx++) {
      const c = r[tx] || '.';
      const cx = tx * TILE + TILE / 2, floorY = (ty + 1) * TILE;
      if (c === '#') grid[ty][tx] = T_SOLID;
      else if (c === '^') grid[ty][tx] = T_SPIKE;
      else if (c === '<' || c === '>') { grid[ty][tx] = T_CANNON; lv.cannons.push({ tx, ty, dir: c === '>' ? 1 : -1, cx, cy: ty * TILE + TILE / 2 }); }
      else if (c === 'S') lv.start = { cx, floorY, tx: -1 };
      else if (c === 'E') lv.exit = { x: cx - 16, y: floorY - 32, w: 32, h: 32, cx, floorY };
      else if (c === 'C') lv.checkpoints.push({ cx, floorY, tx, ty });
      else if (c === '*') lv.stars.push({ x: cx, y: ty * TILE + TILE / 2 });
    }
  });
  // lowest walkable surface in the level: dropping below it means you fell into a pit
  let low = 0;
  for (let ty = 0; ty < ROWS; ty++) for (let tx = 0; tx < w; tx++) {
    if (grid[ty][tx] === T_SOLID && (ty === 0 || grid[ty - 1][tx] !== T_SOLID)) low = Math.max(low, ty * TILE);
  }
  lv.deathY = low;
  return lv;
}

function solidAt(lv, tx, ty) {
  if (tx < 0 || tx >= lv.w) return true;      // invisible walls at the level edges
  if (ty < 0 || ty >= lv.h) return false;
  const v = lv.grid[ty][tx];
  return v === T_SOLID || v === T_CANNON;
}

/* ---------- players ---------- */
function makePlayer(i) {
  const s = CFG.size;
  return {
    i, x: 0, y: 0, w: s, h: s, vx: 0, vy: 0,
    onGround: false, support: -1, coyote: 0, buffer: 0,
    face: 1, air: 0, dx: 0, ghost: null, inv: 0, jumping: false, low: 0
  };
}

function placeAtCheckpoint(q, cp) {
  const cx = cp.cx + (q.i === 0 ? -8 : 8);
  q.x = cx - q.w / 2; q.y = cp.floorY - q.h;
  q.vx = 0; q.vy = 0; q.onGround = false; q.support = -1;
  q.coyote = 0; q.buffer = 0; q.air = 0; q.low = 0; q.ghost = null; q.inv = CFG.spawnInv;
}

function createSim(lv) {
  const sim = {
    lv, time: 0, started: false, done: false,
    p: [makePlayer(0), makePlayer(1)],
    stars: lv.stars.map(s => ({ x: s.x, y: s.y, got: false })),
    starCount: 0, cp: lv.start, deaths: 0, deathsBy: [0, 0],
    exitTimer: 0, stretch: 0, events: [], noRope: false,
    ropeEff: CFG.ropeLen, reeling: false,
    bullets: [], cannonT: lv.cannons.map((c, i) => (i * 1.1) % lv.cannonCfg.period), noCannons: false, noChasers: false,
    chaser: lv.chaser ? { kind: lv.chaser.kind, speed: lv.chaser.speed, delay: lv.chaser.delay, pause: 0, pos: lv.chaser.kind === 'up' ? lv.chaser.startY : lv.start.cx + lv.chaser.lead } : null
  };
  placeAtCheckpoint(sim.p[0], sim.cp);
  placeAtCheckpoint(sim.p[1], sim.cp);
  sim.p[0].inv = 0; sim.p[1].inv = 0;   // no blinking on the very first spawn
  return sim;
}

function pressJump(sim, i) { sim.p[i].buffer = CFG.buffer; }

/* ---------- tile collision ---------- */
function moveX(lv, q, amt) {
  if (!amt) return;
  q.x += amt;
  const top = Math.floor(q.y / TILE), bot = Math.floor((q.y + q.h - 0.001) / TILE);
  if (amt > 0) {
    const tx = Math.floor((q.x + q.w - 0.001) / TILE);
    for (let ty = top; ty <= bot; ty++) if (solidAt(lv, tx, ty)) { q.x = tx * TILE - q.w; q.vx = 0; break; }
  } else {
    const tx = Math.floor(q.x / TILE);
    for (let ty = top; ty <= bot; ty++) if (solidAt(lv, tx, ty)) { q.x = (tx + 1) * TILE; q.vx = 0; break; }
  }
}

function moveY(lv, q, amt) {
  q.y += amt;
  q.onGround = false;
  const l = Math.floor(q.x / TILE), r = Math.floor((q.x + q.w - 0.001) / TILE);
  if (amt >= 0) {
    const ty = Math.floor((q.y + q.h - 0.001) / TILE);
    for (let tx = l; tx <= r; tx++) if (solidAt(lv, tx, ty)) {
      q.y = ty * TILE - q.h; if (q.vy > 0) q.vy = 0; q.onGround = true; q.support = -1; break;
    }
  } else {
    const ty = Math.floor(q.y / TILE);
    for (let tx = l; tx <= r; tx++) if (solidAt(lv, tx, ty)) { q.y = (ty + 1) * TILE; q.vy = 0; break; }
  }
}

function wallBeside(lv, q, dirx) {
  const top = Math.floor(q.y / TILE), bot = Math.floor((q.y + q.h - 0.001) / TILE);
  const tx = dirx > 0 ? Math.floor((q.x + q.w + 0.5) / TILE) : Math.floor((q.x - 0.5) / TILE);
  for (let ty = top; ty <= bot; ty++) if (solidAt(lv, tx, ty)) return true;
  return false;
}

function touchesSpike(lv, q) {
  const l = Math.floor((q.x + 1) / TILE), r = Math.floor((q.x + q.w - 1) / TILE);
  const t = Math.floor((q.y + 1) / TILE), b = Math.floor((q.y + q.h - 1) / TILE);
  for (let ty = t; ty <= b; ty++) for (let tx = l; tx <= r; tx++) {
    if (tx < 0 || tx >= lv.w || ty < 0 || ty >= lv.h) continue;
    if (lv.grid[ty][tx] !== T_SPIKE) continue;
    const sx = tx * TILE + 3, sy = ty * TILE + 8, sw = TILE - 6, sh = 8;
    if (q.x + q.w - 1 > sx && q.x + 1 < sx + sw && q.y + q.h - 1 > sy && q.y + 1 < sy + sh) return true;
  }
  return false;
}

/* ---------- death / respawn ---------- */
function killPlayers(sim, idxs) {
  sim.deaths++;
  sim.bullets.length = 0;
  const cp = sim.cp;
  if (sim.chaser) {
    const ch = sim.chaser, lc = sim.lv.chaser;
    ch.pause = 1.8;
    ch.pos = ch.kind === 'up' ? Math.max(ch.pos, cp.floorY + 90) : Math.max(ch.pos, cp.cx + lc.lead * 0.9);
  }
  idxs.forEach(i => {
    sim.deathsBy[i]++;
    const q = sim.p[i];
    sim.events.push({ type: 'die', i, x: q.x + q.w / 2, y: Math.min(q.y + q.h / 2, VH - 4) });
  });
  if (idxs.length === 2) {
    placeAtCheckpoint(sim.p[0], cp); placeAtCheckpoint(sim.p[1], cp);
    return;
  }
  const i = idxs[0], j = 1 - i, q = sim.p[i], o = sim.p[j];
  placeAtCheckpoint(q, cp);
  // the partner gets yanked along the rope to the checkpoint
  const tmp = makePlayer(j); placeAtCheckpoint(tmp, cp);
  o.ghost = { t: 0, dur: CFG.yankTime, fx: o.x, fy: o.y, tx: tmp.x, ty: tmp.y };
  o.vx = 0; o.vy = 0; o.support = -1; o.onGround = false;
  sim.events.push({ type: 'yank', i: j });
}

/* manual "take us back to the checkpoint" (Y key): not a death, no fault counted */
function recallToCheckpoint(sim) {
  if (sim.done) return;
  const cp = sim.cp;
  sim.bullets.length = 0;
  if (sim.chaser) {
    const ch = sim.chaser, lc = sim.lv.chaser;
    ch.pause = 1.8;
    ch.pos = ch.kind === 'up' ? Math.max(ch.pos, cp.floorY + 90) : Math.max(ch.pos, cp.cx + lc.lead * 0.9);
  }
  sim.events.push({ type: 'recall', x: sim.p[0].x, y: sim.p[0].y }, { type: 'recall', x: sim.p[1].x, y: sim.p[1].y });
  placeAtCheckpoint(sim.p[0], cp); placeAtCheckpoint(sim.p[1], cp);
}

/* ---------- main step (fixed dt) ---------- */
// inputs[i] = { dir: -1|0|1, held: bool, reel: bool }
function step(sim, dt, inputs) {
  if (sim.done) return;
  const lv = sim.lv, p = sim.p;

  if (!sim.started && (inputs[0].dir || inputs[1].dir || inputs[0].held || inputs[1].held)) sim.started = true;
  if (sim.started) sim.time += dt;

  const prevDx = [p[0].dx, p[1].dx];

  // yank animation
  for (let i = 0; i < 2; i++) {
    const q = p[i];
    if (!q.ghost) continue;
    const g = q.ghost; g.t += dt;
    const u = Math.min(1, g.t / g.dur), e = u * u;
    const nx = g.fx + (g.tx - g.fx) * e, ny = g.fy + (g.ty - g.fy) * e;
    q.dx = nx - q.x; q.x = nx; q.y = ny; q.vx = 0; q.vy = 0;
    if (u >= 1) { q.ghost = null; q.inv = CFG.spawnInv; q.air = 0; }
  }

  // the elastic rope: slack up to its length, then a spring pulling both players together.
  // Holding "reel" (down) shortens the rope so the partner is hauled in.
  const reel = !!(inputs[0].reel || inputs[1].reel);
  sim.reeling = reel;
  if (reel) sim.ropeEff = Math.max(CFG.reelMin, sim.ropeEff - CFG.reelRate * dt);
  else sim.ropeEff = Math.min(CFG.ropeLen, sim.ropeEff + CFG.reelRelease * dt);
  sim.stretch = 0;
  if (!sim.noRope && !p[0].ghost && !p[1].ghost) {
    const a = p[0], b = p[1];
    const dx = (b.x + b.w / 2) - (a.x + a.w / 2), dy = (b.y + b.h / 2) - (a.y + a.h / 2);
    const dist = Math.hypot(dx, dy);
    if (dist > 0.001) {
      const nx = dx / dist, ny = dy / dist;
      const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
      let acc = 0;
      if (dist > CFG.ropeLen) acc = Math.min(CFG.ropeMaxAcc, CFG.ropeK * (dist - CFG.ropeLen)) + CFG.ropeDamp * rv;
      let wx = nx, wy = ny, wacc = 0, lift = false;
      if (reel && dist > CFG.reelMin) {
        // winch: a steady pull that tapers off as the players meet
        wacc = CFG.reelMaxAcc * Math.min(1, (dist - CFG.reelMin) / 8) + CFG.ropeDamp * rv * 0.5;
        // a player hugging a wall gets lifted so the haul can finish over the ledge
        const lower = b.y > a.y ? b : a, upper = lower === b ? a : b;
        const toward = (upper.x + upper.w / 2) > (lower.x + lower.w / 2) ? 1 : -1;
        if (lower.y - upper.y > -2 && wallBeside(lv, lower, toward)) {
          let tx = (upper.x + upper.w / 2) - (lower.x + lower.w / 2);
          let ty = (upper.y + upper.h / 2 - CFG.reelLift) - (lower.y + lower.h / 2);
          const m = Math.hypot(tx, ty) || 1; tx /= m; ty /= m;
          // direction as seen from a toward b
          wx = lower === b ? -tx : tx; wy = lower === b ? -ty : ty; lift = true;
        }
      }
      if (acc < 0) acc = 0;
      if (wacc > acc) acc = wacc;
      if (!lift) { wx = nx; wy = ny; }
      a.vx += wx * acc * dt; a.vy += wy * acc * dt;
      b.vx -= wx * acc * dt; b.vy -= wy * acc * dt;
      // a hard enough yank rips a standing player off the ground so they get dragged
      if (!reel && acc > CFG.dislodgeAcc) {
        for (const q of [a, b]) {
          if (q.onGround && Math.abs(q.vx) > 40) {
            q.vy = Math.min(q.vy, -CFG.dislodgePop); q.onGround = false; q.support = -1; q.coyote = 0;
            sim.events.push({ type: 'tug', i: q.i, x: q.x + q.w / 2, y: q.y + q.h });
          }
        }
      }
      sim.stretch = Math.max(0, dist - CFG.ropeLen);
    }
  }

  // input, friction, gravity, jump
  for (let i = 0; i < 2; i++) {
    const q = p[i]; if (q.ghost) continue;
    const inp = inputs[i], dir = inp.dir;
    if (dir) q.face = dir;
    q.coyote = q.onGround ? CFG.coyote : Math.max(0, q.coyote - dt);
    q.buffer = Math.max(0, q.buffer - dt);
    if (q.inv > 0) q.inv -= dt;

    const acc = q.onGround ? CFG.runAccel : CFG.airAccel;
    if (dir > 0) {
      if (q.vx < CFG.runMax) q.vx = Math.min(CFG.runMax, q.vx + acc * (q.vx < 0 ? CFG.brake : 1) * dt);
    } else if (dir < 0) {
      if (q.vx > -CFG.runMax) q.vx = Math.max(-CFG.runMax, q.vx - acc * (q.vx > 0 ? CFG.brake : 1) * dt);
    } else {
      const grip = (sim.stretch > 0 && !sim.reeling) ? CFG.tautFriction : CFG.friction;   // a taut rope loosens the ground's grip
      const f = (q.onGround ? grip : CFG.airDrag) * dt;
      if (q.vx > 0) q.vx = Math.max(0, q.vx - f); else q.vx = Math.min(0, q.vx + f);
    }

    q.vy = Math.min(CFG.maxFall, q.vy + CFG.gravity * dt);

  }

  // jumps. The player underneath goes first, so a rider can borrow their upward push.
  for (const pass of [0, 1]) {
    for (let i = 0; i < 2; i++) {
      const q = p[i]; if (q.ghost) continue;
      const riding = q.support >= 0 && !p[q.support].ghost;
      if ((pass === 0) === riding) continue;
      if (q.buffer > 0 && q.coyote > 0) {
        const o = p[1 - i];
        let v = CFG.jumpV;
        if (riding && o.vy < 0) v += o.vy * CFG.stackBoost;          // jump off a rising partner: higher
        q.vy = v; q.buffer = 0; q.coyote = 0; q.onGround = false; q.support = -1; q.jumping = true;
        sim.events.push({ type: 'jump', i, x: q.x + q.w / 2, y: q.y + q.h });
        // toss: if the rider is holding jump when the player below launches, they get flung up too
        if (!riding && !o.ghost && o.support === i && inputs[1 - i].held) {
          o.vy = Math.min(o.vy, CFG.jumpV * (1 + CFG.stackBoost)); o.onGround = false; o.support = -1; o.coyote = 0; o.jumping = true;
        }
      }
    }
  }
  for (let i = 0; i < 2; i++) {
    const q = p[i]; if (q.ghost) continue;
    if (q.vy >= 0 || q.onGround) q.jumping = false;
    if (q.jumping && !inputs[i].held && q.vy < CFG.jumpCut) q.vy = CFG.jumpCut;
  }

  // move + collide
  const prevY = [p[0].y, p[1].y];
  for (let i = 0; i < 2; i++) {
    const q = p[i]; if (q.ghost) continue;
    const o = p[1 - i];
    let carry = 0;
    if (q.support >= 0 && !o.ghost) carry = prevDx[1 - i] || 0;
    const x0 = q.x;
    moveX(lv, q, q.vx * dt + carry);
    moveY(lv, q, q.vy * dt);
    // landing on the other player's head
    if (!q.onGround && q.vy >= 0 && !o.ghost) {
      if (q.x + q.w > o.x + 1.5 && q.x < o.x + o.w - 1.5) {
        const prevBottom = prevY[i] + q.h;
        if (prevBottom <= o.y + 3 && q.y + q.h >= o.y) {
          q.y = o.y - q.h; q.vy = Math.min(0, o.vy); q.onGround = true; q.support = 1 - i;
        }
      }
    }
    q.dx = q.x - x0;
    if (q.onGround) q.air = 0; else q.air += dt;
  }

  // cannons fire bullets that fly straight; touch one and you're out, land on top of one to squash it
  const dead = [];
  if (!sim.noCannons && lv.cannons.length) {
    const midX = (p[0].x + p[1].x) / 2, cc = lv.cannonCfg;
    lv.cannons.forEach((c, i) => {
      sim.cannonT[i] -= dt;
      if (sim.cannonT[i] <= 0) {
        sim.cannonT[i] += cc.period;
        if (Math.abs(c.cx - midX) < 300) {
          sim.bullets.push({ x: c.cx + c.dir * 10, y: c.cy, vx: c.dir * cc.speed, dir: c.dir, w: 12, h: 8 });
          sim.events.push({ type: 'shoot', x: c.cx + c.dir * 14, y: c.cy, dir: c.dir });
        }
      }
    });
    for (let k = sim.bullets.length - 1; k >= 0; k--) {
      const bl = sim.bullets[k];
      bl.x += bl.vx * dt;
      if (solidAt(lv, Math.floor((bl.x + bl.dir * 6) / TILE), Math.floor(bl.y / TILE))) {
        sim.events.push({ type: 'boom', x: bl.x, y: bl.y }); sim.bullets.splice(k, 1); continue;
      }
      for (let i = 0; i < 2; i++) {
        const q = p[i]; if (q.ghost) continue;
        if (Math.abs(q.x + q.w / 2 - bl.x) < (q.w + bl.w) / 2 - 1 && Math.abs(q.y + q.h / 2 - bl.y) < (q.h + bl.h) / 2 - 1) {
          if (q.vy > 20 && (q.y + q.h) - (bl.y - bl.h / 2) < 7) {
            q.vy = -230; q.onGround = false; q.support = -1; q.air = 0;
            sim.events.push({ type: 'stomp', x: bl.x, y: bl.y - 4 }); sim.bullets.splice(k, 1);
          } else if (dead.indexOf(i) < 0) dead.push(i);
          break;
        }
      }
    }
  }

  // the chaser: a monster that closes in from the right, or goo that rises from below
  const ch = sim.chaser;
  if (ch && !sim.noChasers) {
    if (sim.started) { if (ch.delay > 0) ch.delay -= dt; else if (ch.pause > 0) ch.pause -= dt; else ch.pos -= ch.speed * dt; }
    for (let i = 0; i < 2; i++) {
      const q = p[i]; if (q.ghost || dead.indexOf(i) >= 0) continue;
      if (ch.kind === 'up' ? (q.y + q.h > ch.pos + 3) : (q.x + q.w > ch.pos)) dead.push(i);
    }
  }

  // hazards
  for (let i = 0; i < 2; i++) {
    const q = p[i]; if (q.ghost || dead.indexOf(i) >= 0) continue;
    if (q.y + q.h > lv.deathY + 6) q.low += dt; else q.low = 0;   // below the floor: a 3-second countdown (a haul back up cancels it)
    if (q.y > CFG.killY || q.low >= CFG.lowTime || touchesSpike(lv, q) || q.air > CFG.hangLimit) dead.push(i);
  }
  if (dead.length) killPlayers(sim, dead);

  // pickups, checkpoints
  for (let i = 0; i < 2; i++) {
    const q = p[i]; if (q.ghost) continue;
    for (const s of sim.stars) {
      if (s.got) continue;
      if (Math.abs(q.x + q.w / 2 - s.x) < 9 && Math.abs(q.y + q.h / 2 - s.y) < 9) {
        s.got = true; sim.starCount++; sim.events.push({ type: 'star', x: s.x, y: s.y });
      }
    }
    for (const cp of lv.checkpoints) {
      if (cp.tx <= sim.cp.tx) continue;
      if (Math.abs(q.x + q.w / 2 - cp.cx) < 12 && q.y + q.h > cp.floorY - 28 && q.y < cp.floorY) {
        sim.cp = cp; sim.events.push({ type: 'checkpoint', x: cp.cx, y: cp.floorY });
      }
    }
  }

  // exit: both players inside
  const ex = lv.exit;
  const inside = q => !q.ghost && q.x + q.w / 2 > ex.x && q.x + q.w / 2 < ex.x + ex.w && q.y + q.h / 2 > ex.y && q.y + q.h / 2 < ex.y + ex.h + 4;
  const n = (inside(p[0]) ? 1 : 0) + (inside(p[1]) ? 1 : 0);
  sim.inExit = n;
  if (n === 2) sim.exitTimer += dt; else sim.exitTimer = Math.max(0, sim.exitTimer - dt * 2);
  if (sim.exitTimer >= CFG.exitHold) { sim.done = true; sim.events.push({ type: 'win' }); }
}

if (typeof module !== 'undefined') {
  module.exports = { recallToCheckpoint, T_CANNON, TILE, VW, VH, ROWS, CFG, parseLevel, createSim, step, pressJump, solidAt, placeAtCheckpoint, makePlayer, moveX, moveY, touchesSpike };
}

// ---- particles ----
let parts = [];
function puff(x, y, n, col, spd, grav, life, size) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = (0.3 + Math.random() * 0.7) * spd;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - spd * 0.2, g: grav, life: life * (0.6 + Math.random() * 0.4), max: life, col, size: size || 2 });
  }
}
function updateParts(dt) {
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
}
function drawParts(camX) {
  for (const p of parts) { ctx.globalAlpha = Math.min(1, p.life / (p.max * 0.5)); rect(p.x - camX, p.y, p.size, p.size, p.col); }
  ctx.globalAlpha = 1;
}

// ---- rope drawing (beads) ----
function drawRope(x1, y1, x2, y2, restLen, stretch, reeling, t) {
  const dx = x2 - x1, dy = y2 - y1, d = Math.hypot(dx, dy) || 1;
  let sag = 0; if (d < restLen) sag = Math.min(6, Math.sqrt((restLen - d) * 3 * d / 8));
  const n = Math.max(2, Math.ceil(d / 2.5)), nx = -dy / d, ny = dx / d;
  const wob = stretch > 3 ? Math.min(1.6, stretch * 0.07) : 0;
  let a = C.skin, b = '#a8785a';
  if (stretch > 16) { a = C.red; b = '#8a2a30'; } else if (stretch > 4) { a = C.orange; b = '#b0601c'; }
  if (reeling) { a = Math.floor(t * 12) % 2 ? C.yellow : C.cream; b = C.orange; }
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const u = i / n; let px = x1 + dx * u, py = y1 + dy * u + sag * 4 * u * (1 - u);
    if (wob) { const w = Math.sin(t * 50 + u * 14) * wob * Math.sin(Math.PI * u); px += nx * w; py += ny * w; }
    pts.push([Math.round(px), Math.round(py)]);
  }
  ctx.fillStyle = C.ink; pts.forEach(p => ctx.fillRect(p[0] - 2, p[1] - 1, 4, 4));
  pts.forEach((p, i) => { ctx.fillStyle = i % 2 ? a : b; ctx.fillRect(p[0] - 1, p[1], 2, 2); });
}

// ---- game state ----
const G = { mode: 'menu', sel: 0, t: 0, li: 0, sim: null, cam: 0, shake: 0, hintT: 0, winT: 0, result: null, acc: 0, reelTick: 0, prev: [{}, {}], flash: 0 };
const keys = new Set();

function startLevel(i) {
  G.li = i; G.sim = createSim(LEVELS[i]); G.mode = 'play'; G.hintT = 0; G.winT = 0; G.result = null; G.acc = 0; G.shake = 0;
  parts = [];
  const p = G.sim.p; G.cam = clamp((p[0].x + p[1].x) / 2 - VW / 2, 0, Math.max(0, LEVELS[i].pixelW - VW));
  G.prev = [{ ground: true, vy: 0 }, { ground: true, vy: 0 }];
  tilesFor(i);
}
function isUnlocked(i) { return UNLOCK_ALL || i === 0 || !!save.levels[i - 1]; }

function readInputs() {
  const d = KEYMAP.dot, s = KEYMAP.square;
  return [
    { dir: (keys.has(d.right) ? 1 : 0) - (keys.has(d.left) ? 1 : 0), held: keys.has(d.jump), reel: keys.has(d.reel) },
    { dir: (keys.has(s.right) ? 1 : 0) - (keys.has(s.left) ? 1 : 0), held: keys.has(s.jump), reel: keys.has(s.reel) }
  ];
}

// ---- input events ----
const BLOCK = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space']);
window.addEventListener('keydown', e => {
  if (BLOCK.has(e.code)) e.preventDefault();
  audioInit();
  if (e.repeat) return;
  keys.add(e.code);
  if (e.code === 'KeyM') { muted = !muted; return; }
  if (e.code === 'KeyF') { try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); } catch (er) { } return; }
  if (G.mode === 'menu') menuKey(e.code);
  else if (G.mode === 'play' || G.mode === 'won') {
    if (G.mode === 'play') {
      if (e.code === KEYMAP.dot.jump) pressJump(G.sim, 0);
      if (e.code === KEYMAP.square.jump) pressJump(G.sim, 1);
    }
    if (e.code === 'KeyR') startLevel(G.li);
    if (e.code === 'KeyY' && G.mode === 'play') recallToCheckpoint(G.sim);
    if (e.code === 'Escape') { G.mode = 'menu'; G.sel = G.li; }
  } else if (G.mode === 'complete') {
    if (e.code === 'Enter' || e.code === 'Space') { SFX.pick(); if (G.li + 1 < LEVELS.length) startLevel(G.li + 1); else { G.mode = 'menu'; G.sel = 0; } }
    if (e.code === 'KeyR') startLevel(G.li);
    if (e.code === 'Escape') { G.mode = 'menu'; G.sel = G.li; }
  }
});
window.addEventListener('keyup', e => { keys.delete(e.code); });
window.addEventListener('blur', () => keys.clear());

const COLS = 4, CARD = { w: 106, h: 48, gx: 8, gy: 6, x0: 16, y0: 90 };
function cardRect(i) { const c = i % COLS, r = Math.floor(i / COLS); return { x: CARD.x0 + c * (CARD.w + CARD.gx), y: CARD.y0 + r * (CARD.h + CARD.gy), w: CARD.w, h: CARD.h }; }
function menuKey(code) {
  const n = LEVELS.length;
  if (code === 'ArrowRight' || code === 'KeyD') { G.sel = (G.sel + 1) % n; SFX.menu(); }
  else if (code === 'ArrowLeft' || code === 'KeyA') { G.sel = (G.sel + n - 1) % n; SFX.menu(); }
  else if (code === 'ArrowDown' || code === 'KeyS') { G.sel = (G.sel + COLS < n) ? G.sel + COLS : G.sel % COLS; SFX.menu(); }
  else if (code === 'ArrowUp' || code === 'KeyW') { G.sel = (G.sel >= COLS) ? G.sel - COLS : ((G.sel + COLS < n) ? G.sel + COLS : G.sel); SFX.menu(); }
  else if (code === 'Enter' || code === 'Space') { if (isUnlocked(G.sel)) { SFX.pick(); startLevel(G.sel); } }
}
cv.addEventListener('mousedown', e => {
  audioInit();
  if (G.mode !== 'menu') return;
  const r = cv.getBoundingClientRect(), mx = (e.clientX - r.left) / r.width * VW, my = (e.clientY - r.top) / r.height * VH;
  for (let i = 0; i < LEVELS.length; i++) { const c = cardRect(i); if (mx >= c.x && mx < c.x + c.w && my >= c.y && my < c.y + c.h) { G.sel = i; if (isUnlocked(i)) { SFX.pick(); startLevel(i); } } }
});

// ---- update ----
function handleEvents(sim) {
  for (const ev of sim.events) {
    if (ev.type === 'jump') { (ev.i === 0 ? SFX.jump0 : SFX.jump1)(); puff(ev.x, ev.y, 4, C.cream, 40, 120, 0.3, 2); }
    else if (ev.type === 'star') { SFX.star(); puff(ev.x, ev.y, 10, C.yellow, 70, 60, 0.5, 2); }
    else if (ev.type === 'checkpoint') { SFX.flag(); puff(ev.x, ev.y - 16, 14, C.cream, 80, 100, 0.6, 2); }
    else if (ev.type === 'die') { SFX.die(); G.shake = 0.25; puff(ev.x, ev.y, 18, ev.i === 0 ? C.yellow : C.red, 120, 200, 0.7, 3); }
    else if (ev.type === 'yank') { SFX.yank(); }
    else if (ev.type === 'recall') { puff(ev.x + 5, ev.y + 5, 8, C.aqua, 80, 0, 0.5, 2); if (!G.recallSfx || G.t - G.recallSfx > 0.1) { SFX.yank(); G.recallSfx = G.t; } }
    else if (ev.type === 'tug') { SFX.tug(); G.shake = Math.max(G.shake, 0.07); puff(ev.x, ev.y, 6, C.cream, 60, 80, 0.3, 2); }
    else if (ev.type === 'shoot') { SFX.shoot(); puff(ev.x, ev.y, 6, C.steel, 50, 0, 0.35, 3); }
    else if (ev.type === 'stomp') { SFX.stomp(); puff(ev.x, ev.y, 10, C.orange, 90, 80, 0.4, 2); }
    else if (ev.type === 'boom') { SFX.boom(); puff(ev.x, ev.y, 5, C.orange, 50, 40, 0.3, 2); }
    else if (ev.type === 'win') { SFX.win(); }
  }
  sim.events.length = 0;
}

function update(dt) {
  G.t += dt;
  updateParts(dt);
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt);
  if (G.mode !== 'play' && G.mode !== 'won' && G.mode !== 'complete') return;
  const sim = G.sim, lv = LEVELS[G.li];

  if (G.mode === 'play') {
    G.hintT += dt;
    G.acc += dt;
    const inp = readInputs();
    let n = 0;
    while (G.acc >= STEP && n < 12) {
      step(sim, STEP, inp); G.acc -= STEP; n++;
      handleEvents(sim);
      if (sim.done) break;
    }
    if (G.acc > STEP * 12) G.acc = 0;

    // landing dust + yank trail + reel ticks
    sim.p.forEach((q, i) => {
      const pv = G.prev[i];
      if (q.onGround && !pv.ground && pv.vy > 140) puff(q.x + q.w / 2, q.y + q.h, 4, C.cream, 36, 100, 0.25, 2);
      pv.ground = q.onGround; pv.vy = q.vy;
      if (q.ghost) puff(q.x + q.w / 2, q.y + q.h / 2, 1, i === 0 ? C.yellow : C.red, 20, 0, 0.3, 2);
    });
    if (sim.chaser) {
      const c = sim.chaser, near = c.kind === 'up' ? (VH - c.pos) > -40 : (c.pos - (G.cam + VW)) < 220;
      if (near && c.delay <= 0) { G.shake = Math.max(G.shake, 0.035); G.growl = (G.growl || 0) - dt; if (G.growl <= 0) { G.growl = 1.1; if (c.kind === 'up') tone(90, 55, 0.4, 'triangle', 0.05); else tone(70, 38, 0.5, 'sawtooth', 0.05); } }
    }
    if (sim.reeling) { G.reelTick -= dt; if (G.reelTick <= 0) { SFX.tick(); G.reelTick = 0.09; } }

    if (sim.done) {
      G.mode = 'won'; G.winT = 0;
      const ex = lv.exit; puff(ex.cx, ex.y + 12, 50, C.yellow, 140, 160, 1.2, 3); puff(ex.cx, ex.y + 12, 30, C.cream, 100, 120, 1.0, 2);
      const best = save.levels[G.li];
      const stars = sim.starCount, time = sim.time;
      const isNew = !best || stars > best.stars || (stars === best.stars && time < best.time);
      if (isNew) { save.levels[G.li] = { stars: Math.max(stars, best ? best.stars : 0), time: (best && best.stars > stars) ? best.time : time }; writeSave(); }
      G.result = { stars, time, best: save.levels[G.li], isNew, faults: sim.deathsBy.slice() };
    }
  } else if (G.mode === 'won') {
    G.winT += dt;
    if (G.winT > 1.0) G.mode = 'complete';
  }

  // camera follows the pair
  const p = sim.p, mid = (p[0].x + p[1].x) / 2 + 5;
  const target = clamp(mid - VW / 2, 0, Math.max(0, lv.pixelW - VW));
  G.cam += (target - G.cam) * (1 - Math.exp(-dt * 7));
}

    ctx.globalAlpha = clamp(al, 0, 1);
    let hw = 0; ctx.font = '8px "Press Start 2P", monospace'; lv.hint.forEach(l => { hw = Math.max(hw, ctx.measureText(l).width); });
    ctx.globalAlpha = clamp(al, 0, 1) * 0.6; rect(VW / 2 - hw / 2 - 8, 229, hw + 16, lv.hint.length * 13 + 4, C.ink);
    ctx.globalAlpha = clamp(al, 0, 1);
    lv.hint.forEach((line, i) => txt(line, VW / 2, 232 + i * 13, { align: 'center', color: i === 0 ? C.yellow : C.cream }));
    ctx.globalAlpha = 1;
  }
  txt('R: RESTART   Y: CHECKPOINT   ESC: MENU', 6, 262, { color: C.cream });
  // floor countdown (hanging below the lowest ground)
  sim.p.forEach(q => {
    if (q.low > 0.05) {
      const n = Math.ceil(CFG.lowTime - q.low), px = clamp(Math.round(q.x + q.w / 2 - G.cam), 14, VW - 14);
      txt(String(n), px, 164, { size: 24, align: 'center', color: C.cream, shadowColor: C.red });
      txt('HAUL THEM UP!', px, 194, { align: 'center', color: C.yellow });
    }
  });
  // stuck? the player decides
  if (sim.p.some(q => q.air > 2.5 && !q.ghost) && Math.floor(G.t * 2) % 2 === 0) txt('STUCK? PRESS R TO RESTART', VW / 2, 24, { align: 'center', color: C.yellow });
  // monster warning when it is just off-screen
  const ch = sim.chaser;
  if (ch && ch.kind === 'left') {
    const gap = ch.pos - (G.cam + VW);
    if (gap > 0 && gap < 320 && Math.floor(G.t * 4) % 2 === 0) { rect(VW - 34, 104, 28, 36, C.ink); rect(VW - 32, 106, 24, 32, C.red); txt('!', VW - 20, 112, { size: 16, align: 'center', color: C.cream, shadow: false }); }
  }
}

function drawComplete() {
  const r = G.result; if (!r) return;
  ctx.globalAlpha = 0.6; rect(0, 0, VW, VH, C.ink); ctx.globalAlpha = 1;
  const w = 300, h = 170, x = (VW - w) / 2, y = 52;
  rect(x - 2, y - 2, w + 4, h + 4, C.ink); rect(x, y, w, h, C.navy); rect(x + 3, y + 3, w - 6, h - 6, '#1d2150');
  txt('LEVEL CLEAR!', VW / 2, y + 14, { size: 16, align: 'center', color: C.yellow });
  const total = LEVELS[G.li].stars.length;
  for (let i = 0; i < total; i++) { const got = i < r.stars; drawStarPat(VW / 2 - total * 14 + i * 28 + 2, y + 42, got ? C.yellow : C.stone, got ? C.cream : null, 3, true); }
  txt('TIME ' + fmtTime(r.time), VW / 2, y + 74, { align: 'center' });
  const bst = r.best;
  txt(r.isNew ? 'NEW BEST!' : ('BEST ' + fmtTime(bst.time) + '  ' + bst.stars + '/' + total + ' STARS'), VW / 2, y + 90, { align: 'center', color: r.isNew ? C.yellow : C.steel });
  const f = r.faults, verdict = (f[0] + f[1] === 0) ? 'FLAWLESS! NOBODY FELL!' : f[0] > f[1] ? "DOT'S FAULT!" : f[1] > f[0] ? "SQUARE'S FAULT!" : 'BOTH TO BLAME!';
  ctx.drawImage(SPR.dot[1], VW / 2 - 118, y + 106); txt(String(f[0]), VW / 2 - 102, y + 108, { color: C.yellow });
  txt(verdict, VW / 2 + 8, y + 108, { align: 'center', color: C.cream });
  ctx.drawImage(SPR.square[1], VW / 2 + 106, y + 106); txt(String(f[1]), VW / 2 + 122, y + 108, { color: C.red });
  const next = G.li + 1 < LEVELS.length;
  txt(next ? 'ENTER: NEXT LEVEL' : 'ENTER: LEVEL SELECT', VW / 2, y + 130, { align: 'center' });
  txt('R: REPLAY   ESC: MENU', VW / 2, y + 146, { align: 'center', color: C.steel });
}

// ---- menu ----
function drawMenu() {
  drawBackground(0, G.t * 18, G.t);
  ctx.globalAlpha = 0.35; rect(0, 0, VW, VH, C.ink); ctx.globalAlpha = 1;
  txt('TETHERED', VW / 2, 8, { size: 24, align: 'center', color: C.yellow, shadowColor: C.red });
  txt('TWO PLAYERS. ONE ROPE. ONE KEYBOARD.', VW / 2, 38, { align: 'center' });
  // the two friends, hopping on the title
  const base = 76, ph = G.t * 1.6;
  const hopA = Math.max(0, Math.sin(ph * Math.PI)) * 9, hopB = Math.max(0, Math.sin((ph - 0.25) * Math.PI)) * 9;
  const ax = 196, bx = 284;
  rect(ax - 20, base + 1, 128, 3, C.ink);
  const ay = base - 6 - hopA, by = base - 6 - hopB;
  drawRope(ax, ay, bx, by, 90, Math.max(0, Math.hypot(bx - ax, ay - by) - 90), false, G.t);
  ctx.drawImage(SPR.dot[1], ax - 6, ay - 6); ctx.drawImage(SPR.square[0], bx - 6, by - 6);

  for (let i = 0; i < LEVELS.length; i++) {
    const c = cardRect(i), sel = i === G.sel, un = isUnlocked(i), sv = save.levels[i];
    rect(c.x - 2, c.y - 2, c.w + 4, c.h + 4, sel ? (Math.floor(G.t * 4) % 2 ? C.yellow : C.cream) : C.ink);
    rect(c.x, c.y, c.w, c.h, un ? C.navy : C.slate);
    rect(c.x + 2, c.y + 2, c.w - 4, c.h - 4, un ? '#1d2150' : '#38343a');
    txt(String(i + 1), c.x + 8, c.y + 6, { color: un ? C.yellow : C.stone });
    const total = LEVELS[i].stars.length;
    for (let k = 0; k < total; k++) { const got = sv && k < sv.stars; drawStarPat(c.x + 24 + k * 11, c.y + 6, got ? C.yellow : C.stone, got ? C.cream : null, 1, true); }
    txt(LEVELS[i].name, c.x + 8, c.y + 19, { color: un ? C.cream : C.stone, shadow: un });
    if (!un) txt('LOCKED', c.x + 8, c.y + 33, { color: C.stone, shadow: false });
    else txt(sv ? fmtTime(sv.time) : '--:--.-', c.x + 8, c.y + 33, { color: sv ? C.cream : C.steel });
  }
  txt('ARROWS/WASD CHOOSE  ENTER PLAY  M SOUND  F FULL', VW / 2, 258, { align: 'center', color: C.steel });
}

function render() {
  ctx.imageSmoothingEnabled = false;
  if (G.mode === 'menu') { drawMenu(); return; }
  drawWorld(); drawHUD();
  if (G.mode === 'complete') drawComplete();
}

// ---- main loop ----
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); render();
  requestAnimationFrame(frame);
}
(function boot() {
  const m = /[?&]level=(\d+)/.exec(location.search);
  if (m) { const n = parseInt(m[1], 10) - 1; if (n >= 0 && n < LEVELS.length) startLevel(n); }
  if (document.fonts && document.fonts.load) document.fonts.load('8px "Press Start 2P"').catch(() => { });
  requestAnimationFrame(frame);
})();

</script>
</body>
</html>
